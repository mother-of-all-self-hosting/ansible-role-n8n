---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: n8n-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        n8n_debug_service_enabled: false

        # Molecule-only variables, shared by side_effect.yml and verify.yml.
        # They are not consumed by the role itself.
        n8n_molecule_base_url: http://localhost:5678
        n8n_molecule_owner_email: molecule@example.com
        n8n_molecule_owner_first_name: Molecule
        n8n_molecule_owner_last_name: Tester
        # n8n rejects anything shorter than 8 characters, or without a digit
        # and a capital letter, with a 400 that is easy to mistake for a
        # broken instance.
        n8n_molecule_owner_password: MoleculePassword1
        n8n_molecule_workflow_name: Molecule Webhook Workflow
        n8n_molecule_webhook_path: molecule-probe
        n8n_molecule_marker: molecule-n8n-roundtrip
        # The SQLite database n8n keeps below the role's data directory.
        # Spelled out rather than derived from `n8n_data_path`, which is a
        # template that the verifier does not evaluate.
        n8n_molecule_sqlite_path: /n8n/data/.n8n/database.sqlite

        # Variables for n8n
        n8n_uid: 1000
        n8n_gid: 1000
        n8n_scheme: http
        n8n_hostname: localhost
        n8n_container_labels_traefik_enabled: false
        n8n_container_http_host_bind_port: 5678
        n8n_environment_variables_n8n_editor_base_url: http://localhost:5678/
        n8n_environment_variables_webhook_url: http://localhost:5678/
        n8n_systemd_docker_base_timeout_sec: "5m"

        # `n8n_database_type` is deliberately left unset, so that this scenario
        # tests whatever the role defaults to. verify.yml reads that default out
        # of defaults/main.yml and requires n8n to report running on it.
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
