---
# A fresh n8n serves an owner-setup wizard and answers `200` on `/` and on
# `/healthz` while nobody has ever configured it. Tests written against that
# instance pass without n8n being usable, so the scenario sets n8n up first and
# gives it something real to do: a webhook-triggered workflow, created and
# activated through n8n's documented public API. verify.yml then triggers the
# webhook and asserts the execution happened.
#
# The setup is done here rather than in converge.yml on purpose: it is a
# one-time state change that would make converge non-idempotent.
- name: Set n8n up and give it a workflow to run
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Run the checks shared by all n8n scenarios
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/side_effect_tasks.yml"
